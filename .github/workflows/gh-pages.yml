name: Publish GitHub Pages

# Controls when the action will run.
on:
  workflow_dispatch:
    inputs:
      save_data_in_github_cache:
        required: true
        type: boolean
        default: true
      data_cache_prefix:
        required: true
        type: string
        default: rongqizhang_garmin_runs
  workflow_call:
    inputs:
      save_data_in_github_cache:
        required: true
        type: boolean
        default: true
      data_cache_prefix:
        required: true
        type: string
        default: rongqizhang_garmin_runs

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          # if your default branches is not master, please change it here
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Restore personal running data
        id: restore_data
        if: inputs.save_data_in_github_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            activities
            assets
            GPX_OUT
            TCX_OUT
            FIT_OUT
            Workouts
            run_page/data.db
            src/static/activities.json
            imported.json
          key: ${{ inputs.data_cache_prefix }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.data_cache_prefix }}-${{ github.sha }}-
            ${{ inputs.data_cache_prefix }}-

      - name: Verify personal running data before publishing
        env:
          RESTORE_ENABLED: ${{ inputs.save_data_in_github_cache }}
          RESTORED_CACHE_KEY: ${{ steps.restore_data.outputs.cache-matched-key }}
          EXPECTED_CACHE_PREFIX: ${{ inputs.data_cache_prefix }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          prefix = os.environ.get('EXPECTED_CACHE_PREFIX', '')
          key = os.environ.get('RESTORED_CACHE_KEY', '')
          if os.environ.get('RESTORE_ENABLED', '').lower() != 'true':
              raise SystemExit('::error::Enable the running data cache before publishing. Refusing to publish repository sample data.')
          if not prefix or not key.startswith(prefix + '-'):
              raise SystemExit('::error::Personal running data cache was not found. Run Run Data Sync first. The existing website will be kept.')
          path = Path('src/static/activities.json')
          if not path.is_file():
              raise SystemExit('::error::Restored activity data is missing. Publishing stopped.')
          activities = json.loads(path.read_text(encoding='utf-8'))
          if not isinstance(activities, list) or not activities:
              raise SystemExit('::error::Restored activity data is empty or invalid. Publishing stopped.')
          print(f'Publishing {len(activities)} activities from the restored running data cache.')
          PY

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install
      - name: Build
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          VITE_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: PATH_PREFIX=/$REPO_NAME pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist repository
          name: pages-artifact
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-artifact
